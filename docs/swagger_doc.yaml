paths: [object] [Definea all APi routes]
  /path: [string] [Specifie endpoint URL]
    method: [object] [HTTP mrthod GET, POST, PUT and DELETE]
      tags: [string] [Groups endpoint in UI]
      summary: [string] [Short description]
      description: [string] [Detailed description]
      operationId: [string] [Uniqe operstion name]
      security: [array(object)] [Auth requirements]
      deprecated: [boolean] [Marks endpoint outdated]
      parameters: [array] [lists of inputs]
        - name: [string] [parameters name]
          in: query/path/headers/cookie [string] [Location(query/path/header/cookie)]
          description: [string] [parameter explanation]
          required: [boolean] [Mandorty or not]
          deprecated: [boolean] [Marks deprecated para]
